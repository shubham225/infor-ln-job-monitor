spring:
  # SQLite Config
  datasource:
    url: jdbc:sqlite:${JOB_MONITOR_HOME}/data/job-monitor.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect