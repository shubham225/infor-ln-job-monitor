# Application Info
info:
  application:
    name: JobMonitor-Server
    description: Job monitoring service for Infor LN, providing real-time job tracking and status APIs.
    author: Shubham Shinde
    version: v1.0.0

# App Config
app:
  security:
    api-key: ${JOB_MONITOR_API_KEY:my-secret-dev-key}

# Server Config
server:
  error:
    whitelabel:
      enabled: false
  port: ${JOB_MONITOR_SERVER_PORT:8080}

# Spring Config
spring:
  application:
    name: job-monitor-server
  output:
    ansi:
      enabled: always
  profiles:
    active: sqlite
    thymeleaf:
      cache: true
      encoding: utf-8
      enabled: true
      prefix: classpath:/templates/
      suffix: .html
  security:
    oauth2:
      client:
        registration:
          sso:
            client-id: ${OAUTH_CLIENT_ID}
            client-secret: ${OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            provider: sso-provider
            client-name: Login with SSO
        provider:
          sso-provider:
            issuer-uri: ${OAUTH_ISSUER_URI}

# Logging
logging:
  pattern:
    console: "[%-5level]\t%d{yyyy-MM-dd HH:mm:ss.SSS}\t[%thread] %logger{0} - %msg%n"
  level:
    org.springframework.security: DEBUG

# App Config
mail:
  user: ${MAIL_USER}
  password: ${MAIL_PASSWORD}
